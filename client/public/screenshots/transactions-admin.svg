  <rect x="482" y="158" width="140" height="34" rx="10" fill="#f8fafc" stroke="#dbe4f0"/>
  <rect x="634" y="158" width="120" height="34" rx="10" fill="#f8fafc" stroke="#dbe4f0"/>
  <rect x="766" y="158" width="120" height="34" rx="10" fill="#f8fafc" stroke="#dbe4f0"/>
