<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Finance Dashboard UI</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Dashboard Overview</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="360" height="110" rx="18" fill="#eef2ff"/>
    <rect x="440" y="140" width="360" height="110" rx="18" fill="#ecfdf3"/>
    <rect x="820" y="140" width="360" height="110" rx="18" fill="#fff1f2"/>
  </g>
  <text x="92" y="180" font-family="Arial" font-size="18" fill="#475569">Total Balance</text>
  <text x="92" y="220" font-family="Arial" font-size="34" font-weight="700" fill="#111827">$7,950</text>
  <text x="472" y="180" font-family="Arial" font-size="18" fill="#475569">Income</text>
  <text x="472" y="220" font-family="Arial" font-size="34" font-weight="700" fill="#111827">$13,560</text>
  <text x="852" y="180" font-family="Arial" font-size="18" fill="#475569">Expenses</text>
  <text x="852" y="220" font-family="Arial" font-size="34" font-weight="700" fill="#111827">$5,610</text>

  <g filter="url(#shadow)">
    <rect x="60" y="280" width="740" height="360" rx="18" fill="#ffffff"/>
    <rect x="830" y="280" width="390" height="360" rx="18" fill="#ffffff"/>
  </g>
  <text x="90" y="325" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Balance Trend</text>
  <polyline points="100,560 220,520 340,500 460,470 580,440 700,405" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,560 220,520 340,500 460,470 580,440 700,405 700,600 100,600" fill="#e0e7ff" opacity="0.45"/>
  <g fill="#4f46e5">
    <circle cx="100" cy="560" r="6"/><circle cx="220" cy="520" r="6"/><circle cx="340" cy="500" r="6"/>
    <circle cx="460" cy="470" r="6"/><circle cx="580" cy="440" r="6"/><circle cx="700" cy="405" r="6"/>
  </g>
  <text x="90" y="640" font-family="Arial" font-size="14" fill="#64748b">Jan</text>
  <text x="210" y="640" font-family="Arial" font-size="14" fill="#64748b">Feb</text>
  <text x="330" y="640" font-family="Arial" font-size="14" fill="#64748b">Mar</text>
  <text x="450" y="640" font-family="Arial" font-size="14" fill="#64748b">Apr</text>
  <text x="570" y="640" font-family="Arial" font-size="14" fill="#64748b">May</text>
  <text x="690" y="640" font-family="Arial" font-size="14" fill="#64748b">Jun</text>

  <text x="860" y="325" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Spending Breakdown</text>
  <circle cx="1020" cy="455" r="95" fill="none" stroke="#e2e8f0" stroke-width="34"/>
  <path d="M1020 360 A95 95 0 0 1 1102 411" fill="none" stroke="#4f46e5" stroke-width="34" stroke-linecap="round"/>
  <path d="M1102 411 A95 95 0 0 1 1020 550" fill="none" stroke="#8b5cf6" stroke-width="34" stroke-linecap="round"/>
  <path d="M1020 550 A95 95 0 0 1 940 420" fill="none" stroke="#f97316" stroke-width="34" stroke-linecap="round"/>
  <rect x="860" y="575" width="16" height="16" rx="4" fill="#4f46e5"/><text x="886" y="588" font-family="Arial" font-size="14" fill="#334155">Housing</text>
  <rect x="955" y="575" width="16" height="16" rx="4" fill="#8b5cf6"/><text x="981" y="588" font-family="Arial" font-size="14" fill="#334155">Food</text>
  <rect x="1040" y="575" width="16" height="16" rx="4" fill="#f97316"/><text x="1066" y="588" font-family="Arial" font-size="14" fill="#334155">Travel</text>
